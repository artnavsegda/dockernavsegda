# Frontend: document root /www (mounted from ./openwrt/www), ucode CGI,
# errors go to syslog (logread).

server.port = 80
server.errorlog-use-syslog = "enable"
index-file.names += ( "index.uc" )
static-file.exclude-extensions += ( ".uc" )

cgi.assign += ( ".uc" => "/usr/bin/ucode" )

